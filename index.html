<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juegos de Mesa</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- <link
      rel="stylesheet"
      media="screen and (max-widht: 768px)"
      href="mobile.css"
    /> -->
  </head>
  <body>
    <div class="page">
      <!-- Main Content -->
      <section class="container">
        <nav class="navbar">
          <div class="navbar__content">
            <img src="./public/logo.png" alt="logo" />
            <ul>
              <li><a href="/">Más Vendidos</a></li>
              <li><a href="/">Cartas</a></li>
              <li><a href="/">Juegos de Mesa</a></li>
              <li><a href="/">Ofertas</a></li>
            </ul>
          </div>
        </nav>

        <section class="main-content">
          <p>Hechos para</p>
          <h1>Tirar Los Dados!</h1>
          <p>
            Reúne a tus amigos, prepara la mesa y deja que comience la
            diversión. Tenemos los mejores juegos de mesa para cada ocasión:
            desde partidas épicas hasta risas inolvidables.
          </p>
        </section>

        <section class="side-content">
          <p id="game-name">Munchkin</p>
          <div></div>
          <img src="./public/munchkin_game.png" alt="munchkin" />
        </section>

        <section class="footer">
          <div class="catan" id="button1">
            <img src="./public/catan_game.png" alt="Catan" />
          </div>
          <div class="munchkin" id="button2">
            <img src="./public/munchkin_game.png" alt="Munchkin" />
          </div>
          <div class="exploding-kittens" id="button3">
            <img
              src="./public/explodingKittens_game.png"
              alt="Exploding_Kittens"
            />
          </div>
        </section>

        <!-- OTRA ZONA -->
      </section>
      <!-- Loader -->
      <section class="loader">
        <div></div>
        <div></div>
        <div></div>
      </section>
      <div class="modal hidden">
        <div class="modal__content">
          <button class="modal__content--close" aria-label="Cerrar">✕</button>

          <div class="modal__content--slider">
            <input type="radio" name="slider" id="radio-1" checked />
            <input type="radio" name="slider" id="radio-2" />
            <input type="radio" name="slider" id="radio-3" />

            <div class="cards">
              <label
                for="radio-1"
                class="card"
                id="card-1"
                data-name="Munchkin"
              >
                <img src="./public/munchkin_game.png" alt="Munchkin" />
              </label>
              <label for="radio-2" class="card" id="card-2" data-name="Catan">
                <img src="./public/catan_game.png" alt="Catan" />
              </label>
              <label
                for="radio-3"
                class="card"
                id="card-3"
                data-name="Exploding Kittens"
              >
                <img
                  src="./public/explodingKittens_game.png"
                  alt="Exploding Kittens"
                />
              </label>
            </div>
          </div>

          <button class="btn-buy">¡Lo quiero!</button>
        </div>
      </div>
    </div>
  </body>
  <script src="scripts.js"></script>
</html>
